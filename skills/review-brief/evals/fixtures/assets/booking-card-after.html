<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 1200px;
        height: 700px;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #182235;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: 980px; }
      h1 { margin: 0 0 12px; font-size: 32px; }
      .hint { margin: 0 0 30px; color: #667085; font-size: 17px; }
      .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
      .card {
        min-height: 270px;
        padding: 28px;
        border: 1px solid #d9e0ec;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 12px 34px rgba(38, 52, 77, 0.08);
      }
      .card.cancelled { opacity: 0.62; }
      .badge {
        display: inline-flex;
        padding: 6px 12px;
        border-radius: 999px;
        background: #e8f2ff;
        color: #175cd3;
        font-weight: 700;
      }
      .cancelled .badge { background: #eef0f3; color: #475467; }
      h2 { margin: 25px 0 20px; font-size: 28px; }
      dl { display: grid; grid-template-columns: 120px 1fr; gap: 14px 18px; margin: 0; }
      dt { color: #667085; }
      dd { margin: 0; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <h1>预约列表</h1>
      <p class="hint">改后状态：卡片直接展示服务状态与负责员工</p>
      <section class="cards">
        <article class="card">
          <span class="badge">进行中</span>
          <h2>Milo</h2>
          <dl>
            <dt>服务状态</dt><dd>洗护进行中</dd>
            <dt>负责员工</dt><dd>Avery</dd>
          </dl>
        </article>
        <article class="card cancelled">
          <span class="badge">已取消</span>
          <h2>Coco</h2>
          <dl>
            <dt>服务状态</dt><dd>预约已取消</dd>
            <dt>负责员工</dt><dd>Jordan</dd>
          </dl>
        </article>
      </section>
    </main>
  </body>
</html>
