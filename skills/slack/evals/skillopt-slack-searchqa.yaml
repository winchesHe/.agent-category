_base_: "/Users/moego-perfecto/code/open-source/SkillOpt/configs/searchqa/default.yaml"

model:
  backend: claude_chat
  optimizer_backend: claude_chat
  target_backend: claude_chat
  optimizer: claude-sonnet-4-6
  target: claude-sonnet-4-6
  reasoning_effort: ""
  rewrite_reasoning_effort: ""
  rewrite_max_completion_tokens: 4096

train:
  num_epochs: 1
  train_size: 4
  batch_size: 2
  seed: 42

gradient:
  minibatch_size: 2
  merge_batch_size: 2
  analyst_workers: 1
  max_analyst_rounds: 1
  failure_only: false

optimizer:
  learning_rate: 2
  min_learning_rate: 1
  lr_scheduler: constant
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: false
  use_meta_skill: false

evaluation:
  use_gate: true
  sel_env_num: 3
  test_env_num: 3
  eval_test: true

env:
  name: searchqa
  skill_init: "/Users/moego-perfecto/.ai-config/custom-skills/slack/SKILL.md"
  split_mode: split_dir
  split_dir: "/Users/moego-perfecto/.ai-config/custom-skills/slack/evals/skillopt-searchqa-split"
  out_root: "/Users/moego-perfecto/.ai-config/custom-skills/slack/evals/skillopt-runs/smoke"
  max_turns: 1
  workers: 1
  max_completion_tokens: 512
